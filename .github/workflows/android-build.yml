name: Android CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  WORKING_DIRECTORY: mantis-master/mantis-master
  ANDROID_SDK_API_LEVEL: 35

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_SDK_API_LEVEL }}
          target: android-35
          build-tools: 35.0.0

      - name: Validate Gradle Wrapper
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          test -f ./gradlew || { echo "Gradle wrapper not found"; exit 1; }
          chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties') }}-${{ hashFiles('**/*.kts') }}-${{ hashFiles('**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Assemble Debug APK
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mantis-debug-apk
          path: ${{ env.WORKING_DIRECTORY }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            ${{ env.WORKING_DIRECTORY }}/app/build/reports/
            ${{ env.WORKING_DIRECTORY }}/app/build/logs/
          retention-days: 7
