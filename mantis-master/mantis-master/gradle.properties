# Android project-wide Gradle settings

# AndroidX — required for all modern Android libraries
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Gradle JVM memory — increased from default 512m to handle Compose + Ktor dependency graph
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel builds
org.gradle.parallel=true

# Build cache
org.gradle.caching=true
